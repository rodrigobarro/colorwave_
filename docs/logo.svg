<svg xmlns="http://www.w3.org/2000/svg" width="360" height="120" viewBox="0 0 360 120" role="img" aria-label="Colorwave">
  <style>
    text { fill: #171717; font: 600 56px Geist, Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -1.5px; }
    @media (prefers-color-scheme: dark) { text { fill: #ededed; } }
  </style>
  <!-- The site's oklch(0.7 0.2 30) to oklch(0.7 0.2 260) bar, in sRGB stops. -->
  <linearGradient id="wave" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#ff614d"/>
    <stop offset="0.167" stop-color="#ff5c86"/>
    <stop offset="0.333" stop-color="#f260b7"/>
    <stop offset="0.5" stop-color="#da6ae1"/>
    <stop offset="0.667" stop-color="#b978ff"/>
    <stop offset="0.833" stop-color="#8e8bff"/>
    <stop offset="1" stop-color="#579bff"/>
  </linearGradient>
  <text x="180" y="64" text-anchor="middle">Colorwave</text>
  <rect x="40" y="88" width="280" height="9" rx="4.5" fill="url(#wave)"/>
</svg>
